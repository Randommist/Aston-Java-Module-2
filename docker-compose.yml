# Все контейнеры общаются по именам сервисов во внутренней сети Compose.
x-runtime-env: &runtime-env
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

x-spring-cloud-env: &spring-cloud-env
  <<: *runtime-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://discovery-server:8761/eureka

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  start_period: 45s
  retries: 30

x-spring-cloud-deps: &spring-cloud-deps
  config-server:
    condition: service_healthy
  discovery-server:
    condition: service_healthy

services:
  config-server:
    build: ./config-server
    environment: *runtime-env
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8888/actuator/health/readiness"]
    mem_limit: 512m
    restart: unless-stopped

  discovery-server:
    build: ./discovery-server
    environment: *runtime-env
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8761/actuator/health/readiness"]
    mem_limit: 512m
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    depends_on:
      <<: *spring-cloud-deps
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment: *spring-cloud-env
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8080/actuator/health/readiness"]
    mem_limit: 512m
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      <<: *spring-cloud-deps
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *spring-cloud-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-user_service}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8082/actuator/health/readiness"]
    mem_limit: 768m
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    depends_on:
      <<: *spring-cloud-deps
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      <<: *spring-cloud-env
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:?Задайте NOTIFICATION_API_KEY в .env}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8081/actuator/health/readiness"]
    mem_limit: 512m
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:16.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_NAME:-user_service}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    restart: unless-stopped

  kafka:
    image: docker.io/apache/kafka:4.1.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      start_period: 40s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped

  mailpit:
    image: docker.io/axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
  kafka-data:
