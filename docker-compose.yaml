# Вся система: инфраструктура (БД, Kafka, SMTP), Spring Cloud (конфигурация,
# реестр сервисов, gateway) и сами сервисы. Клиенты ходят только через
# api-gateway на http://localhost:8080.

x-spring-cloud-env: &spring-cloud-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://discovery-server:8761/eureka

x-spring-cloud-deps: &spring-cloud-deps
  config-server:
    condition: service_healthy
  discovery-server:
    condition: service_healthy

services:
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    healthcheck:
      # В образе нет curl: проверяем, что порт открыт (Tomcat открывает его в конце старта)
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8888'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on: *spring-cloud-deps
    environment:
      <<: *spring-cloud-env
    ports:
      - "8080:8080"
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service
    depends_on:
      <<: *spring-cloud-deps
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      <<: *spring-cloud-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-user_service}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
    ports:
      # Напрямую — только для Swagger UI; API для клиентов идёт через gateway
      - "8082:8082"
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    container_name: notification-service
    depends_on:
      <<: *spring-cloud-deps
      kafka:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      <<: *spring-cloud-env
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:?Задайте NOTIFICATION_API_KEY в .env}
    ports:
      - "8081:8081"
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:16.0
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_NAME:-user_service}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-user_service}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: docker.io/apache/kafka:4.1.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Два listener'а: kafka:29092 для контейнеров, localhost:9092 для хоста.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  mailpit:
    image: docker.io/axllent/mailpit:v1.27.4
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
