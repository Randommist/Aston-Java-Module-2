name: Compose integration

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Только для одноразового стенда CI, не секрет реального окружения.
      NOTIFICATION_API_KEY: compose-ci-only-key
    steps:
      - uses: actions/checkout@v6
      - name: Build and start all containers
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check service interaction
        run: python3 scripts/smoke_test.py
      - name: Container diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
      - name: Stop disposable CI environment
        if: always()
        run: docker compose down --volumes --remove-orphans
