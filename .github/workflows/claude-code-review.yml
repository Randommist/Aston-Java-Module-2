name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Сделай код-ревью этого pull request. Пиши на русском.

            1. Посмотри изменения: `gh pr diff` и `gh pr view`. При необходимости читай файлы проекта для контекста.
            2. Ищи реальные проблемы: баги, ошибки логики, проблемы безопасности, утечки ресурсов,
               нарушения правил из CLAUDE.md (если он есть). Не придирайся к стилю и мелочам.
            3. На каждую найденную проблему оставь inline-комментарий к нужной строке
               через mcp__github_inline_comment__create_inline_comment.
            4. В конце оставь один общий комментарий через `gh pr comment` с кратким итогом.
               Если проблем нет — так и напиши.

            Не запускай подагентов и не вноси изменения в код.
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
