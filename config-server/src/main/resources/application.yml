server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: config-server
  profiles:
    # native — конфиги лежат рядом с сервером, а не в отдельном git-репозитории
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_SEARCH_LOCATIONS:classpath:/config}
